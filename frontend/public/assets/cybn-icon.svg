<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- CYBN Neural Monogram (Minimal & Authentic) -->
  <defs>
    <linearGradient id="cybn-arc-grad" x1="8" y1="6" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cybn-spark-grad" x1="22" y1="12" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="cybn-glow" x="14" y="8" width="22" height="22" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container optional/transparent; here self-contained icon -->
  <!-- Outer Synaptic Pathway (Dynamic 'C' Axon Arc) -->
  <path
    d="M 27 10
       C 23.5 7.5 19 6.5 14.5 8
       C 9 10 5.5 15.5 6 21.5
       C 6.5 28 12 33 18.5 33.5
       C 24.5 33.8 30 30 32 24.5"
    stroke="url(#cybn-arc-grad)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Synaptic Cleft Connection Line -->
  <path
    d="M 17 20 L 25 18"
    stroke="#F59E0B"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="1 3.5"
    opacity="0.8"
  />

  <!-- Origin Neural Soma (Memory Anchor) -->
  <circle cx="15" cy="20" r="3.2" fill="#6366F1" />
  <circle cx="15" cy="20" r="1.5" fill="#EEF2FF" />

  <!-- Active Synaptic Spark Node (Consolidation & Recall) -->
  <circle cx="26" cy="17" r="4.2" fill="url(#cybn-spark-grad)" filter="url(#cybn-glow)" />
  <circle cx="26" cy="17" r="1.8" fill="#FFFFFF" />

  <!-- Terminal Receptor Node -->
  <circle cx="27" cy="10" r="2.2" fill="#818CF8" />
</svg>

