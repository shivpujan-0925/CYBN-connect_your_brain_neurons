<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Concept B: The Pure Minimalist Synapse (Monochrome / Dual-tone compatible) -->
  <defs>
    <linearGradient id="min-spark" x1="20" y1="8" x2="30" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="min-axon" x1="8" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Axon Curve: Forming the letter 'C' for Connect & CYBN -->
  <path
    d="M 28 11
       A 13 13 0 1 0 28 29"
    stroke="url(#min-axon)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Synaptic Bridge (Impulse line into center) -->
  <path
    d="M 28 11 L 20 20"
    stroke="url(#min-spark)"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Day 0 Origin Node -->
  <circle cx="28" cy="29" r="3.2" fill="#6366F1" />
  
  <!-- Central Synaptic Core / Nucleus (Mastery) -->
  <circle cx="20" cy="20" r="4.2" fill="url(#min-spark)" />
  <circle cx="20" cy="20" r="1.8" fill="#FFFFFF" />

  <!-- Synapse Impulse Spark Point -->
  <circle cx="28" cy="11" r="2.8" fill="#FBBF24" />
</svg>

