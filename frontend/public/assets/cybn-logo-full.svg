<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Full Brand Lockup: Minimalist Neural Icon + Modern Typography -->
  <defs>
    <linearGradient id="full-axon" x1="6" y1="8" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="full-spark" x1="22" y1="12" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="full-glow" x="16" y="8" width="20" height="20" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Left Symbol (40x40 area centered) -->
  <g transform="translate(4, 4)">
    <!-- Axon C-Arc -->
    <path
      d="M 28 11 A 13 13 0 1 0 28 29"
      stroke="url(#full-axon)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- Synapse bridge line -->
    <path
      d="M 28 11 L 20 20"
      stroke="url(#full-spark)"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <!-- Origin Node (Day 0) -->
    <circle cx="28" cy="29" r="3" fill="#6366F1" />
    
    <!-- Mastery Nucleus -->
    <circle cx="20" cy="20" r="3.8" fill="url(#full-spark)" filter="url(#full-glow)" />
    <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" />

    <!-- Active Terminal Node -->
    <circle cx="28" cy="11" r="2.6" fill="#FBBF24" />
  </g>

  <!-- Right Typography (Space Grotesk + JetBrains Mono) -->
  <g transform="translate(54, 0)">
    <text x="0" y="27" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.03em" fill="currentColor">
      CY<tspan fill="#F59E0B">B</tspan>N
    </text>
    <text x="1" y="39" font-family="'JetBrains Mono', monospace" font-size="6.8" font-weight="600" letter-spacing="0.14em" fill="#9DA5C2">
      CONNECT YOUR BRAIN NEURONS
    </text>
  </g>
</svg>

