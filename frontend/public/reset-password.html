<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password — CYBN</title>

  <script>
    (function () {
      const saved = localStorage.getItem('cybn_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/output.css" />
</head>

<body class="min-h-screen flex flex-col justify-between">

  <!-- Floating Pill Navbar -->
  <header class="pt-4 px-4 sm:px-6 w-full max-w-5xl mx-auto">
    <nav class="pill-navbar backdrop-blur-xl">
      <a href="./index.html" class="flex items-center gap-2.5 group">
        <div class="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-b from-slate-900 to-slate-950 dark:from-ink-800 dark:to-ink-950 border border-spark/40 shadow-sm group-hover:border-spark transition-colors duration-200">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12L5 6M12 12L19 6M12 12L4 16M12 12L20 16M12 12L12 3M5 6L12 3M19 6L12 3" stroke="#F59E0B" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.65" />
            <path d="M5 6L4 16M19 6L20 16" stroke="#818CF8" stroke-width="1" stroke-dasharray="1.5 1.5" stroke-opacity="0.6" />
            <circle cx="12" cy="3" r="1.6" fill="#818CF8" />
            <circle cx="5" cy="6" r="1.8" fill="#FBBF24" />
            <circle cx="19" cy="6" r="1.8" fill="#818CF8" />
            <circle cx="4" cy="16" r="1.6" fill="#34D399" />
            <circle cx="20" cy="16" r="1.6" fill="#FBBF24" />
            <circle cx="12" cy="12" r="2.8" fill="#F59E0B" />
            <circle cx="12" cy="12" r="4.2" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.4" />
          </svg>
        </div>
        <span class="font-display font-bold text-base tracking-tight text-light-ink dark:text-paper group-hover:text-spark transition-colors">CYBN</span>
      </a>

      <div class="flex items-center gap-3">
        <button type="button"
          class="js-theme-toggle h-9 w-9 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors"
          title="Toggle theme">
          <span class="js-theme-icon"></span>
        </button>
        <a href="./login.html" class="nav-pill-link text-xs sm:text-sm">
          &larr; Back to <span class="text-dendrite font-semibold">Log in</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Centered Reset Card -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-12">
    <div class="w-full max-w-md animate-fade-up" id="page-root">
      <div class="mb-8 text-center">
        <div
          class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-mastered/15 text-mastered mb-4 border border-mastered/30">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="font-display text-3xl font-bold text-light-ink dark:text-paper">Set new password</h1>
        <p class="text-light-muted dark:text-paper-muted mt-2 text-sm">Choose a strong, secure password for your
          account.</p>
      </div>

      <div class="card p-6 sm:p-8 shadow-xl">
        <form id="reset-form" class="space-y-5">
          <div>
            <label class="label" for="password">New Password</label>
            <input class="input" id="password" name="password" type="password" placeholder="At least 8 characters"
              required minlength="8" />
          </div>

          <div>
            <label class="label" for="confirm">Confirm New Password</label>
            <input class="input" id="confirm" name="confirm" type="password" placeholder="Repeat your password" required
              minlength="8" />
          </div>

          <div id="form-message" class="text-xs rounded-xl p-3 hidden animate-fade-in"></div>

          <button type="submit" class="btn-primary w-full text-sm sm:text-base py-3 rounded-xl shadow-glow"
            id="submit-btn">
            Update Password
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer
    class="border-t border-light-border dark:border-ink-600/60 py-6 text-center text-xs font-mono text-light-dim dark:text-paper-dim">
    &copy; CYBN — Spaced Repetition for DSA
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-btn');

    if (!token) {
      document.getElementById('page-root').innerHTML = `
        <div class="card p-8 text-center">
          <p class="text-overdue mb-4 text-sm">This link is missing its reset token — it may have been copied incorrectly or expired.</p>
          <a href="./forgot-password.html" class="btn-secondary">Request a new link</a>
        </div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.classList.add('hidden');

      if (form.password.value !== form.confirm.value) {
        messageEl.textContent = "Passwords do not match.";
        messageEl.className = 'text-xs bg-overdue/10 text-overdue border border-overdue/20 rounded-xl p-3 block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      try {
        await api.auth.resetPassword(token, form.password.value);
        document.getElementById('page-root').innerHTML = `
          <div class="card p-8 text-center animate-fade-up">
            <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-mastered/15 text-mastered mb-4">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h2 class="font-display text-2xl font-bold text-light-ink dark:text-paper mb-2">Password updated</h2>
            <p class="text-sm text-light-muted dark:text-paper-muted mb-6">Your password has been changed successfully.</p>
            <a href="./login.html" class="btn-primary w-full py-2.5">Proceed to Log In</a>
          </div>`;
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'text-xs bg-overdue/10 text-overdue border border-overdue/20 rounded-xl p-3 block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>

</html>
