<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password — CYBN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/output.css" />
</head>
<body class="min-h-screen flex flex-col">

  <header class="border-b border-ink-600/60">
    <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-spark/15 text-spark font-display font-bold">C</span>
        <span class="font-display font-semibold text-lg tracking-tight">CYBN</span>
      </a>
      <a href="./login.html" class="nav-link">← Back to log in</a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md" id="page-root">
      <div class="mb-8 text-center">
        <h1 class="font-display text-3xl font-semibold">Set a new password</h1>
        <p class="text-paper-muted mt-2">Choose something you haven't used before.</p>
      </div>

      <form id="reset-form" class="card p-8 space-y-5">
        <div>
          <label class="label" for="password">New password</label>
          <input class="input" id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div>
          <label class="label" for="confirm">Confirm new password</label>
          <input class="input" id="confirm" name="confirm" type="password" required minlength="8" />
        </div>
        <p id="form-message" class="text-sm hidden"></p>
        <button type="submit" class="btn-primary w-full text-base py-3" id="submit-btn">Update password</button>
      </form>
    </div>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-btn');

    if (!token) {
      document.getElementById('page-root').innerHTML = `
        <div class="card p-8 text-center">
          <p class="text-overdue mb-4">This link is missing its reset token — it may have been copied incorrectly.</p>
          <a href="./forgot-password.html" class="btn-secondary">Request a new link</a>
        </div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.classList.add('hidden');

      if (form.password.value !== form.confirm.value) {
        messageEl.textContent = "Passwords don't match.";
        messageEl.classList.remove('hidden');
        messageEl.classList.add('text-overdue');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      try {
        await api.auth.resetPassword(token, form.password.value);
        document.getElementById('page-root').innerHTML = `
          <div class="card p-8 text-center">
            <p class="text-mastered mb-4">Password updated — you can log in with it now.</p>
            <a href="./login.html" class="btn-primary">Go to log in</a>
          </div>`;
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.classList.remove('hidden', 'text-mastered');
        messageEl.classList.add('text-overdue');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
