<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem Detail — CYBN</title>

  <script>
    (function () {
      const saved = localStorage.getItem('cybn_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./assets/cybn-minimal.svg" />
  <link rel="stylesheet" href="./css/output.css" />
  <!-- Progressive Web App -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#070913" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CYBN" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
</head>

<body class="min-h-screen flex flex-col">

  <!-- Floating Pill Navbar -->
  <header class="sticky top-4 z-50 px-3 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto">
    <nav class="pill-navbar backdrop-blur-xl">
      <div class="flex items-center gap-3">
        <a href="./dashboard.html" class="flex items-center gap-2.5 shrink-0">
          <div class="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-b from-slate-900 to-slate-950 dark:from-ink-800 dark:to-ink-950 border border-spark/40 shadow-sm">
            <svg class="h-5 w-5" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 28 11 A 13 13 0 1 0 28 29" stroke="#6366F1" stroke-width="3.2" stroke-linecap="round" />
              <path d="M 28 11 L 20 20" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
              <circle cx="28" cy="29" r="3" fill="#6366F1" />
              <circle cx="20" cy="20" r="4.2" fill="#F59E0B" />
              <circle cx="20" cy="20" r="1.6" fill="#FFFFFF" />
              <circle cx="28" cy="11" r="2.8" fill="#FBBF24" />
            </svg>
          </div>
          <span class="font-display font-bold text-base tracking-tight text-light-ink dark:text-paper hidden sm:inline">CY<span class="text-spark">B</span>N</span>
        </a>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <a href="./dashboard.html" class="nav-pill-link text-xs sm:text-sm hidden sm:inline-block">&larr; Dashboard</a>
        <a href="./problems.html" class="nav-pill-link text-xs sm:text-sm hidden sm:inline-block">All Problems</a>
        <a href="./stats.html" class="nav-pill-link text-xs sm:text-sm hidden sm:inline-block">Stats</a>

                <!-- Minimal PWA Install Button -->
        <button type="button" class="hidden js-pwa-install-btn h-8 w-8 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 text-light-dim dark:text-paper-dim hover:text-spark dark:hover:text-spark-soft transition-colors shadow-sm" title="Install CYBN App" aria-label="Install CYBN App">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        </button>
        <button type="button" class="js-theme-toggle h-8 w-8 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors" title="Toggle theme">
          <span class="js-theme-icon"></span>
        </button>

        <button type="button" id="mobile-menu-btn" class="sm:hidden h-8 w-8 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors" aria-label="Toggle navigation">
          <svg id="menu-icon-open" class="h-4 w-4 text-light-ink dark:text-paper" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg id="menu-icon-close" class="h-4 w-4 text-light-ink dark:text-paper hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div id="mobile-menu" class="hidden sm:hidden absolute top-full left-0 right-0 mt-2 p-4 card backdrop-blur-2xl shadow-xl z-50 animate-fade-up">
        <div class="flex flex-col gap-2">
          <a href="./dashboard.html" class="px-4 py-2 rounded-xl text-sm text-light-muted dark:text-paper-muted hover:bg-slate-50 dark:hover:bg-ink-800">&larr; Dashboard</a>
          <a href="./problems.html" class="px-4 py-2 rounded-xl text-sm text-light-muted dark:text-paper-muted hover:bg-slate-50 dark:hover:bg-ink-800">All Problems</a>
          <a href="./stats.html" class="px-4 py-2 rounded-xl text-sm text-light-muted dark:text-paper-muted hover:bg-slate-50 dark:hover:bg-ink-800">Stats &amp; Analytics</a>
        </div>
      </div>

    </nav>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10" id="page-root">
    <p class="text-light-dim dark:text-paper-dim">Loading problem details…</p>
  </main>

  <template id="problem-template">
    <div class="flex items-start justify-between gap-4 mb-8 flex-wrap">
      <div>
        <span class="js-difficulty-pill mb-2 inline-block"></span>
        <h1 class="font-display text-2xl sm:text-3xl font-bold text-light-ink dark:text-paper js-name"></h1>
      </div>
      <div class="flex gap-2 shrink-0">
        <button class="btn-secondary !py-1.5 !px-3.5 text-xs sm:text-sm js-edit-btn">Edit</button>
        <button class="btn-danger !py-1.5 !px-3.5 text-xs sm:text-sm js-delete-btn">Delete</button>
      </div>
    </div>

    <!-- Synapse pathway stepper card -->
    <div class="card p-6 sm:p-8 mb-8 shadow-sm">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <p class="font-mono text-xs uppercase tracking-widest text-light-dim dark:text-paper-dim">Spaced Revision
          Pathway</p>
        <span class="js-status-pill"></span>
      </div>

      <div class="py-2 overflow-x-auto">
        <div class="min-w-[420px]">
          <div class="flex items-center js-stepper"></div>
          <div
            class="flex items-center mt-3 text-[11px] font-mono text-light-dim dark:text-paper-dim js-stepper-labels">
          </div>
        </div>
      </div>

      <div
        class="mt-6 pt-6 border-t border-light-border dark:border-ink-600/60 flex items-center justify-between flex-wrap gap-3">
        <p class="text-xs sm:text-sm text-light-muted dark:text-paper-muted js-next-action-label"></p>
        <div class="flex gap-2">
          <button class="btn-primary js-complete-btn hidden !py-1.5 !px-4 text-xs sm:text-sm">Mark Done</button>
          <button class="btn-secondary js-restart-btn !py-1.5 !px-3.5 text-xs sm:text-sm">Restart from Day 0</button>
        </div>
      </div>
    </div>

    <!-- Active Recall & Metadata view -->
    <div class="card p-6 sm:p-8 js-view-mode shadow-sm">
      <div class="flex items-center justify-between gap-4 mb-6 flex-wrap pb-4 border-b border-light-border dark:border-ink-600/50">
        <div class="flex items-center gap-2.5">
          <div class="h-8 w-8 rounded-lg bg-spark/15 text-spark flex items-center justify-center border border-spark/30">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
          </div>
          <div>
            <h2 class="font-display text-base sm:text-lg font-bold text-light-ink dark:text-paper leading-tight">Active Recall &amp; Notes</h2>
            <p class="text-[11px] text-light-muted dark:text-paper-muted">Strengthen synaptic pathways by recalling before revealing</p>
          </div>
        </div>

        <!-- Controls: Recall Toggle & Stopwatch -->
        <div class="flex items-center gap-2.5 flex-wrap">
          <!-- Stopwatch -->
          <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 dark:bg-ink-900 border border-light-border dark:border-ink-600/50 text-xs font-mono">
            <span class="text-light-muted dark:text-paper-dim">⏱️</span>
            <span id="recall-stopwatch" class="font-bold text-light-ink dark:text-paper">00:00</span>
            <button type="button" id="stopwatch-toggle" class="hover:text-spark ml-1 font-sans text-[11px] font-semibold">Start</button>
            <button type="button" id="stopwatch-reset" class="hover:text-overdue text-[11px] text-light-muted dark:text-paper-dim">Reset</button>
          </div>

          <!-- Mode Toggle -->
          <button type="button" id="active-recall-toggle-btn" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border border-spark/40 bg-spark/10 text-spark transition-all">
            <span id="active-recall-dot" class="h-2 w-2 rounded-full bg-spark"></span>
            <span id="active-recall-toggle-text">Recall Mode: ON</span>
          </button>
        </div>
      </div>

      <!-- General Info: Topic & LeetCode Link (Always visible) -->
      <div class="grid sm:grid-cols-2 gap-4 pb-5 mb-5 border-b border-light-border dark:border-ink-600/40 text-sm">
        <div>
          <dt class="label">Topic</dt>
          <dd class="js-topic text-light-ink dark:text-paper font-medium">—</dd>
        </div>
        <div>
          <dt class="label">Resource Link</dt>
          <dd class="js-link text-light-ink dark:text-paper">—</dd>
        </div>
      </div>

      <!-- Active Recall Curtain (Masked View) -->
      <div id="recall-curtain" class="rounded-xl border border-dashed border-spark/40 bg-spark/5 p-6 text-center space-y-3">
        <div class="h-10 w-10 mx-auto rounded-full bg-spark/15 text-spark flex items-center justify-center border border-spark/30 animate-pulse">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h3 class="font-display text-base font-bold text-light-ink dark:text-paper">Pattern &amp; Notes Masked for Active Recall</h3>
        <p class="text-xs text-light-muted dark:text-paper-muted max-w-md mx-auto">
          Test your neural recall: try to remember the optimal algorithmic pattern, time &amp; space complexity, and edge cases before checking.
        </p>
        <div class="pt-2">
          <button type="button" id="recall-reveal-btn" class="btn-primary !px-5 !py-2 text-xs sm:text-sm shadow-glow font-bold">
            👁️ Reveal Solution &amp; Notes
          </button>
        </div>
        <p class="text-[10px] font-mono text-light-dim dark:text-paper-dim">or press <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-ink-700 text-light-ink dark:text-paper font-semibold">Space</kbd> to reveal</p>
      </div>

      <!-- Unmasked Solution & Notes Section -->
      <div id="recall-content" class="hidden space-y-6">
        <dl class="grid sm:grid-cols-2 gap-5 text-sm">
          <div>
            <dt class="label">Pattern</dt>
            <dd class="js-pattern text-light-ink dark:text-paper font-medium">—</dd>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <dt class="label">Time Complexity</dt>
              <dd class="js-time font-mono text-light-ink dark:text-paper">—</dd>
            </div>
            <div>
              <dt class="label">Space Complexity</dt>
              <dd class="js-space font-mono text-light-ink dark:text-paper">—</dd>
            </div>
          </div>
          <div class="sm:col-span-2">
            <dt class="label">Notes &amp; Edge Cases</dt>
            <dd class="js-notes text-light-ink dark:text-paper whitespace-pre-wrap leading-relaxed font-mono text-xs sm:text-sm bg-slate-50 dark:bg-ink-900/60 p-4 rounded-xl border border-light-border/60 dark:border-ink-600/40">—</dd>
          </div>
        </dl>

        <!-- Confidence Assessment Bar -->
        <div id="confidence-bar" class="p-4 rounded-xl bg-slate-50/80 dark:bg-ink-900/50 border border-light-border dark:border-ink-600/40 flex items-center justify-between flex-wrap gap-3">
          <div>
            <p class="text-xs font-bold text-light-ink dark:text-paper">How confident was your recall?</p>
            <p class="text-[11px] text-light-muted dark:text-paper-muted">Rate your memory retrieval for this revision stage.</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" id="rate-struggled-btn" class="btn-danger !py-1.5 !px-3 text-xs rounded-lg flex items-center gap-1 font-semibold" title="Reset back to Day 0 to relearn">
              <span>🔴</span> Struggled (Restart)
            </button>
            <button type="button" id="rate-nailed-btn" class="btn-primary !py-1.5 !px-3.5 text-xs rounded-lg flex items-center gap-1 shadow-sm font-semibold">
              <span>🟢</span> Nailed it! (Log Done)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Metadata edit form -->
    <form class="card p-6 sm:p-8 space-y-5 js-edit-mode hidden shadow-sm">
      <h2 class="font-display text-lg font-bold text-light-ink dark:text-paper mb-1">Edit Problem Details</h2>
      <div>
        <label class="label">Problem Name</label>
        <input class="input js-input-name" type="text" required />
      </div>
      <div class="grid sm:grid-cols-2 gap-5">
        <div><label class="label">Topic</label><input class="input js-input-topic" type="text" /></div>
        <div><label class="label">Pattern</label><input class="input js-input-pattern" type="text" /></div>
      </div>
      <div class="grid sm:grid-cols-2 gap-5">
        <div><label class="label">Time Complexity</label><input class="input font-mono js-input-time" type="text" />
        </div>
        <div><label class="label">Space Complexity</label><input class="input font-mono js-input-space" type="text" />
        </div>
      </div>
      <div>
        <label class="label">Difficulty</label>
        <select class="input js-input-difficulty">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
      <div><label class="label">Link</label><input class="input js-input-link" type="url" /></div>
      <div><label class="label">Notes</label><textarea class="input js-input-notes" rows="4"></textarea></div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary flex-1 js-save-btn py-2.5">Save Changes</button>
        <button type="button" class="btn-secondary js-cancel-edit-btn py-2.5 px-5">Cancel</button>
      </div>
    </form>
  </template>

  <!-- Footer -->
  <footer
    class="border-t border-light-border dark:border-ink-600/60 mt-auto bg-white/50 dark:bg-ink-950/50 backdrop-blur-md">
    <div class="max-w-3xl mx-auto px-6 py-6 text-center">
      <p class="text-xs text-light-dim dark:text-paper-dim font-mono">-- Built for Engineers, by the engineer.</p>
    </div>
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/palette.js"></script>
  <script src="./js/problem.js"></script>
  <script src="./js/pwa.js"></script>
</body>

</html>
