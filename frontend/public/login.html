<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — CYBN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/output.css" />
</head>
<body class="min-h-screen flex flex-col">

  <header class="border-b border-ink-600/60">
    <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-spark/15 text-spark font-display font-bold">C</span>
        <span class="font-display font-semibold text-lg tracking-tight">CYBN</span>
      </a>
      <a href="./signup.html" class="nav-link">New here? <span class="text-dendrite">Create an account</span></a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <h1 class="font-display text-3xl font-semibold">Welcome back</h1>
        <p class="text-paper-muted mt-2">Your revisions are waiting.</p>
      </div>

      <form id="login-form" class="card p-8 space-y-5">
        <div>
          <label class="label" for="emailOrUsername">Email or username</label>
          <input class="input" id="emailOrUsername" name="emailOrUsername" type="text" required autofocus />
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required />
        </div>
        <p id="form-error" class="text-sm text-overdue hidden"></p>
        <button type="submit" class="btn-primary w-full text-base py-3" id="submit-btn">Log in</button>
      </form>
    </div>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      try {
        await api.auth.login({
          emailOrUsername: form.emailOrUsername.value.trim(),
          password: form.password.value,
        });
        window.location.href = './dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
