<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — CYBN</title>

  <script>
    (function () {
      const saved = localStorage.getItem('cybn_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./assets/cybn-minimal.svg" />
  <link rel="stylesheet" href="./css/output.css" />
</head>

<body class="min-h-screen flex flex-col justify-between">

  <!-- Floating Pill Navbar -->
  <header class="pt-4 px-3 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto">
    <nav class="pill-navbar backdrop-blur-xl">
      <a href="./index.html" class="flex items-center gap-2.5">
        <div class="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-b from-slate-900 to-slate-950 dark:from-ink-800 dark:to-ink-950 border border-spark/40 shadow-sm">
          <svg class="h-5 w-5" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 28 11 A 13 13 0 1 0 28 29" stroke="#6366F1" stroke-width="3.2" stroke-linecap="round" />
            <path d="M 28 11 L 20 20" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
            <circle cx="28" cy="29" r="3" fill="#6366F1" />
            <circle cx="20" cy="20" r="4.2" fill="#F59E0B" />
            <circle cx="20" cy="20" r="1.6" fill="#FFFFFF" />
            <circle cx="28" cy="11" r="2.8" fill="#FBBF24" />
          </svg>
        </div>
        <span class="font-display font-bold text-base tracking-tight text-light-ink dark:text-paper">CY<span class="text-spark">B</span>N</span>
      </a>

      <div class="flex items-center gap-3">
        <button type="button"
          class="js-theme-toggle h-9 w-9 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors"
          title="Toggle theme">
          <span class="js-theme-icon"></span>
        </button>
        <a href="./login.html" class="nav-pill-link text-xs sm:text-sm">
          &larr; Back to <span class="text-dendrite font-semibold">Log in</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Centered Reset Card -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-12">
    <div class="w-full max-w-md animate-fade-up">
      <div class="mb-8 text-center">
        <div
          class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-spark/15 text-spark mb-4 border border-spark/30">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
          </svg>
        </div>
        <h1 class="font-display text-3xl font-bold text-light-ink dark:text-paper">Reset password</h1>
        <p class="text-light-muted dark:text-paper-muted mt-2 text-sm">We will send a reset link directly to your
          registered email.</p>
      </div>

      <div class="card p-6 sm:p-8 shadow-xl">
        <form id="forgot-form" class="space-y-5">
          <div>
            <label class="label" for="email">Account Email</label>
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-light-dim dark:text-paper-dim">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </div>
              <input class="input pl-10" id="email" name="email" type="email" placeholder="you@example.com" required
                autofocus />
            </div>
          </div>

          <div id="form-message" class="text-xs rounded-xl p-3 hidden animate-fade-in"></div>

          <button type="submit" class="btn-primary w-full text-sm sm:text-base py-3 rounded-xl shadow-glow"
            id="submit-btn">
            Send Reset Link
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer
    class="border-t border-light-border dark:border-ink-600/60 py-6 text-center text-xs font-mono text-light-dim dark:text-paper-dim">
    &copy; CYBN — Spaced Repetition for DSA
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const messageEl = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      messageEl.classList.add('hidden');

      try {
        const { message } = await api.auth.forgotPassword(form.email.value.trim());
        messageEl.textContent = message || 'If an account with that email exists, a reset link has been sent.';
        messageEl.className = 'text-xs bg-mastered/10 text-mastered border border-mastered/20 rounded-xl p-3 block';
        form.querySelector('input').disabled = true;
        submitBtn.textContent = 'Link Sent';
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'text-xs bg-overdue/10 text-overdue border border-overdue/20 rounded-xl p-3 block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>

</html>
