<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — CYBN</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/output.css" />
</head>
<body class="min-h-screen flex flex-col">

  <header class="border-b border-ink-600/60">
    <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-spark/15 text-spark font-display font-bold">C</span>
        <span class="font-display font-semibold text-lg tracking-tight">CYBN</span>
      </a>
      <a href="./login.html" class="nav-link">← Back to log in</a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <h1 class="font-display text-3xl font-semibold">Reset your password</h1>
        <p class="text-paper-muted mt-2">Enter your email and we'll send you a reset link.</p>
      </div>

      <form id="forgot-form" class="card p-8 space-y-5">
        <div>
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <p id="form-message" class="text-sm hidden"></p>
        <button type="submit" class="btn-primary w-full text-base py-3" id="submit-btn">Send reset link</button>
      </form>
    </div>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const messageEl = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      messageEl.classList.add('hidden');

      try {
        const { message } = await api.auth.forgotPassword(form.email.value.trim());
        messageEl.textContent = message || 'If an account with that email exists, a reset link has been sent.';
        messageEl.classList.remove('hidden', 'text-overdue');
        messageEl.classList.add('text-mastered');
        form.querySelector('input').disabled = true;
        submitBtn.textContent = 'Sent';
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.classList.remove('hidden', 'text-mastered');
        messageEl.classList.add('text-overdue');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
