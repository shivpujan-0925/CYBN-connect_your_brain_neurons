<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Problems — CYBN</title>

  <script>
    (function() {
      const saved = localStorage.getItem('cybn_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./assets/cybn-minimal.svg" />
  <link rel="stylesheet" href="./css/output.css" />
</head>
<body class="min-h-screen flex flex-col">

  <!-- Floating Pill Navbar with Mobile Menu -->
  <header class="sticky top-3 sm:top-4 z-50 px-3 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto">
    <nav class="pill-navbar backdrop-blur-xl relative">
      <!-- Left: Brand Logo & Desktop Nav Links -->
      <div class="flex items-center gap-3 sm:gap-4 shrink-0">
        <a href="./dashboard.html" class="flex items-center gap-2.5 shrink-0 group">
          <div class="relative flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-b from-slate-900 to-slate-950 dark:from-ink-800 dark:to-ink-950 border border-spark/40 shadow-sm group-hover:border-spark transition-colors">
            <svg class="h-4.5 w-4.5" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 28 11 A 13 13 0 1 0 28 29" stroke="#6366F1" stroke-width="3.2" stroke-linecap="round" />
              <path d="M 28 11 L 20 20" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
              <circle cx="28" cy="29" r="3" fill="#6366F1" />
              <circle cx="20" cy="20" r="4.2" fill="#F59E0B" />
              <circle cx="20" cy="20" r="1.6" fill="#FFFFFF" />
              <circle cx="28" cy="11" r="2.8" fill="#FBBF24" />
            </svg>
          </div>
          <span class="font-display font-bold text-base tracking-tight text-light-ink dark:text-paper">CY<span class="text-spark">B</span>N</span>
        </a>

        <!-- Subtle Vertical Divider -->
        <div class="hidden lg:block h-4 w-px bg-light-border dark:bg-ink-600/60"></div>

        <!-- Primary Desktop Nav Links -->
        <div class="hidden lg:flex items-center gap-1">
          <a href="./dashboard.html" class="nav-pill-link text-xs">Dashboard</a>
          <a href="./problems.html" class="nav-pill-link-active text-xs">All Problems</a>
          <a href="./stats.html" class="nav-pill-link text-xs">Stats</a>
        </div>
      </div>

      <!-- Center: Quick Search / Command Palette Bar -->
      <div class="hidden md:flex flex-1 max-w-sm lg:max-w-md mx-2 lg:mx-4">
        <div class="relative w-full">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-light-dim dark:text-paper-dim pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="Search problems, topics… (Ctrl+K)" class="w-full h-9 bg-slate-100/90 dark:bg-ink-900/80 hover:bg-slate-200/70 dark:hover:bg-ink-900 border border-light-border dark:border-ink-600/50 hover:border-spark/40 dark:hover:border-spark/40 rounded-full pl-9 pr-16 text-xs text-light-ink dark:text-paper placeholder:text-light-dim dark:placeholder:text-paper-dim focus:outline-none focus:ring-1 focus:ring-spark transition-all cursor-pointer shadow-inner" />
          <kbd class="hidden sm:inline-flex items-center absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono px-1.5 py-0.5 rounded bg-white dark:bg-ink-800 text-light-muted dark:text-paper-dim border border-light-border dark:border-ink-600/60 shadow-sm pointer-events-none">Ctrl+K</kbd>
        </div>
      </div>

      <!-- Right: Action & Theme Toggle -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
        <a href="./add-problem.html" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-mono font-medium border border-spark/35 hover:border-spark bg-spark/5 hover:bg-spark/15 dark:bg-spark/10 text-spark-dim dark:text-spark transition-all">
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          <span>Add Problem</span>
        </a>

        <!-- Mobile search button (under md) -->
        <button type="button" id="mobile-search-btn" class="md:hidden h-8 w-8 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 text-light-dim dark:text-paper-dim transition-colors" title="Search">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>

        <!-- Theme Toggle -->
        <button type="button" class="js-theme-toggle h-8 w-8 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors" title="Toggle theme">
          <span class="js-theme-icon"></span>
        </button>

        <!-- Mobile Menu Toggle -->
        <button type="button" id="mobile-menu-btn" class="lg:hidden h-8 w-8 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors" aria-label="Toggle navigation">
          <svg id="menu-icon-open" class="h-4 w-4 text-light-ink dark:text-paper" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg id="menu-icon-close" class="h-4 w-4 text-light-ink dark:text-paper hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Mobile Dropdown Navigation Panel -->
      <div id="mobile-menu" class="hidden lg:hidden absolute top-full left-0 right-0 mt-2 p-3.5 card backdrop-blur-2xl shadow-xl z-50 animate-fade-up">
        <div class="flex flex-col gap-1.5">
          <a href="./dashboard.html" class="px-3.5 py-2 rounded-xl text-xs text-light-muted dark:text-paper-muted hover:bg-slate-50 dark:hover:bg-ink-800">Dashboard</a>
          <a href="./problems.html" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-ink-800 text-light-ink dark:text-paper">All Problems</a>
          <a href="./stats.html" class="px-3.5 py-2 rounded-xl text-xs text-light-muted dark:text-paper-muted hover:bg-slate-50 dark:hover:bg-ink-800">Stats &amp; Analytics</a>
          <a href="./add-problem.html" class="px-3.5 py-2 rounded-xl text-xs text-spark font-semibold hover:bg-slate-50 dark:hover:bg-ink-800">+ Add Problem</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
      <div>
        <h1 class="font-display text-2xl sm:text-3xl font-bold text-light-ink dark:text-paper">All Tracked Problems</h1>
        <p class="text-xs sm:text-sm text-light-muted dark:text-paper-muted mt-1">Full spaced-repetition queue and mastery registry</p>
      </div>
      <a href="./add-problem.html" class="btn-primary py-2 px-4 rounded-xl shadow-glow text-xs sm:text-sm">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Add Problem
      </a>
    </div>

    <!-- Filter Pills Bar -->
    <div class="flex gap-2 mb-6 overflow-x-auto pb-1" id="filter-tabs">
      <button class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-spark text-ink-950 transition-all border border-spark shadow-sm" data-filter="">All</button>
      <button class="btn-secondary !rounded-full !px-3.5 !py-1 text-xs" data-filter="due">Due Today</button>
      <button class="btn-secondary !rounded-full !px-3.5 !py-1 text-xs" data-filter="overdue">Overdue</button>
      <button class="btn-secondary !rounded-full !px-3.5 !py-1 text-xs" data-filter="active">Active</button>
      <button class="btn-secondary !rounded-full !px-3.5 !py-1 text-xs" data-filter="mastered">Mastered</button>
    </div>

    <!-- List container -->
    <div id="list-container" class="card divide-y divide-light-border dark:divide-ink-600/60 overflow-hidden shadow-sm">
      <p class="text-light-dim dark:text-paper-dim text-sm p-6">Loading problems…</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-light-border dark:border-ink-600/60 mt-auto bg-white/50 dark:bg-ink-950/50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center">
      <p class="text-xs text-light-dim dark:text-paper-dim font-mono">-- Built for Engineers, by the engineer.</p>
    </div>
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/palette.js"></script>
  <script>
    (async function init() {
      const user = await requireSession();
      if (!user) return;

      const mobileBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const iconOpen = document.getElementById('menu-icon-open');
      const iconClose = document.getElementById('menu-icon-close');

      if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
          const isOpen = !mobileMenu.classList.contains('hidden');
          if (isOpen) {
            mobileMenu.classList.add('hidden');
            iconOpen.classList.remove('hidden');
            iconClose.classList.add('hidden');
          } else {
            mobileMenu.classList.remove('hidden');
            iconOpen.classList.add('hidden');
            iconClose.classList.remove('hidden');
          }
        });
      }

      const container = document.getElementById('list-container');
      const tabs = document.querySelectorAll('#filter-tabs button');

      function setActiveTab(filter) {
        tabs.forEach((t) => {
          const isActive = t.dataset.filter === filter;
          if (isActive) {
            t.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold bg-spark text-ink-950 transition-all border border-spark shadow-sm';
          } else {
            t.className = 'btn-secondary !rounded-full !px-3.5 !py-1 text-xs';
          }
        });
      }

      async function loadList(filter) {
        container.innerHTML = `<p class="text-light-dim dark:text-paper-dim text-sm p-6">Loading problems…</p>`;
        try {
          const { problems } = await api.problems.list(filter);
          container.innerHTML = problems.length
            ? problems.map(problemRowHTML).join('')
            : `<div class="p-12 text-center text-light-muted dark:text-paper-dim text-sm">No problems match this filter.</div>`;
          attachDoneHandlers();
        } catch (err) {
          container.innerHTML = `<p class="text-overdue text-sm p-6">${escapeHtml(err.message)}</p>`;
        }
      }

      function attachDoneHandlers() {
        container.querySelectorAll('.js-done-btn').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const { id, stage } = btn.dataset;
            btn.disabled = true;
            btn.textContent = '…';
            try {
              await api.problems.completeStage(id, Number(stage));
              toast('Nice — revision completed!', 'success');
              const activeTab = document.querySelector('#filter-tabs button.bg-spark');
              await loadList(activeTab ? activeTab.dataset.filter : '');
            } catch (err) {
              toast(err.message, 'error');
              btn.disabled = false;
              btn.textContent = 'Done';
            }
          });
        });
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          setActiveTab(tab.dataset.filter);
          loadList(tab.dataset.filter);
        });
      });

      await loadList('');
    })();
  </script>
</body>
</html>
