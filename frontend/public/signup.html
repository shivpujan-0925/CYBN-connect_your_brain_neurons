<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — CYBN</title>

  <script>
    (function () {
      const saved = localStorage.getItem('cybn_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./assets/cybn-minimal.svg" />
  <link rel="stylesheet" href="./css/output.css" />
</head>

<body class="min-h-screen flex flex-col justify-between">

  <!-- Floating Pill Navbar -->
  <header class="pt-4 px-3 sm:px-6 lg:px-8 w-full max-w-7xl mx-auto">
    <nav class="pill-navbar backdrop-blur-xl">
      <a href="./index.html" class="flex items-center gap-2.5">
        <div class="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-b from-slate-900 to-slate-950 dark:from-ink-800 dark:to-ink-950 border border-spark/40 shadow-sm">
          <svg class="h-5 w-5" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 28 11 A 13 13 0 1 0 28 29" stroke="#6366F1" stroke-width="3.2" stroke-linecap="round" />
            <path d="M 28 11 L 20 20" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" />
            <circle cx="28" cy="29" r="3" fill="#6366F1" />
            <circle cx="20" cy="20" r="4.2" fill="#F59E0B" />
            <circle cx="20" cy="20" r="1.6" fill="#FFFFFF" />
            <circle cx="28" cy="11" r="2.8" fill="#FBBF24" />
          </svg>
        </div>
        <span class="font-display font-bold text-base tracking-tight text-light-ink dark:text-paper">CY<span class="text-spark">B</span>N</span>
      </a>

      <div class="flex items-center gap-3">
        <button type="button"
          class="js-theme-toggle h-9 w-9 rounded-full flex items-center justify-center border border-light-border dark:border-ink-600/70 hover:bg-slate-100 dark:hover:bg-ink-800 transition-colors"
          title="Toggle theme">
          <span class="js-theme-icon"></span>
        </button>
        <a href="./login.html" class="nav-pill-link text-xs sm:text-sm">
          Already have an account? <span class="text-dendrite font-semibold">Log in</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Centered Signup Card -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-12">
    <div class="w-full max-w-md animate-fade-up">
      <div class="mb-8 text-center">
        <div
          class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-dendrite/15 text-dendrite mb-4 border border-dendrite/30">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
        <h1 class="font-display text-3xl font-bold text-light-ink dark:text-paper">Create account</h1>
        <p class="text-light-muted dark:text-paper-muted mt-2 text-sm">Start strengthening your neural problem pathways.
        </p>
      </div>

      <div class="card p-6 sm:p-8 shadow-xl">
        <form id="signup-form" class="space-y-4">
          <div>
            <label class="label" for="username">Username</label>
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-light-dim dark:text-paper-dim">
                <span class="font-mono text-sm">@</span>
              </div>
              <input class="input pl-9" id="username" name="username" type="text" placeholder="neo_dev" required
                minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" />
            </div>
            <p class="text-[11px] text-light-dim dark:text-paper-dim mt-1.5 font-mono">3-20 alphanumeric characters or
              underscores.</p>
          </div>

          <div>
            <label class="label" for="email">Email Address</label>
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-light-dim dark:text-paper-dim">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </div>
              <input class="input pl-10" id="email" name="email" type="email" placeholder="neo@matrix.io" required />
            </div>
          </div>

          <div>
            <label class="label" for="password">Password</label>
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-light-dim dark:text-paper-dim">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input class="input pl-10 pr-10" id="password" name="password" type="password"
                placeholder="At least 8 characters" required minlength="8" />
              <button type="button" id="toggle-password"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-light-dim dark:text-paper-dim hover:text-light-ink dark:hover:text-paper">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <div id="form-error"
            class="text-xs text-overdue bg-overdue/10 border border-overdue/20 rounded-xl p-3 hidden animate-fade-in">
          </div>

          <button type="submit" class="btn-primary w-full text-sm sm:text-base py-3 rounded-xl shadow-glow mt-2"
            id="submit-btn">
            Create Account
          </button>
        </form>
      </div>

      <p class="text-center text-xs text-light-dim dark:text-paper-dim mt-6 font-mono">
        Free forever · Built by engineers for engineers
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer
    class="border-t border-light-border dark:border-ink-600/60 py-6 text-center text-xs font-mono text-light-dim dark:text-paper-dim">
    &copy; CYBN — Spaced Repetition for DSA
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');
    const passInput = document.getElementById('password');
    const togglePassBtn = document.getElementById('toggle-password');

    togglePassBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-ink-950 inline" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg> Creating account…`;

      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
      };

      try {
        await api.auth.signup(payload);
        window.location.href = './dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>

</html>
